name = "resume-studio-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
# We will bind your secret keys securely in the Cloudflare Dashboard next, 
# but this file must tell the worker that these variables exist.
TURSO_DB_URL = ""
TURSO_AUTH_TOKEN = ""

# If you use a native Cloudflare R2 bucket binding, uncomment the lines below 
# and replace "your-r2-bucket-name" with your actual R2 bucket name:
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "your-r2-bucket-name"
