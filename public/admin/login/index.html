<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Alan Odogwuideh</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css"></head><body class="login-only"><main class="login-screen"><div class="login-card"><div class="admin-brand">Alan<span>.</span><small>Portfolio CMS</small></div><div class="eyebrow">PRIVATE ADMIN</div><h1>Sign in</h1><p>Sign in with your Supabase admin account to manage your portfolio.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" value="alanodogwuideh@gmail.com" autocomplete="username" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required autofocus></label><button class="primary full" type="submit">Sign in</button></form><div style="margin-top:12px;text-align:center"><button id="forgotBtn" type="button" class="secondary">Forgot password?</button></div><div id="loginMsg" class="msg"></div></div></main><script>(async()=>{const msg=document.getElementById('loginMsg');msg.textContent='Checking your Hatchable admin session…';try{const r=await fetch('/api/admin-session',{credentials:'include',redirect:'manual'});if(r.ok){location.replace('/admin/app/');return}let d={};try{d=await r.json()}catch{}if(r.status===401||r.type==='opaqueredirect'){location.replace(d?.login_url||'https://hatchable.com/console/login');return}if(r.status===403){msg.textContent='This Hatchable account does not have admin access to this project.';msg.style.color='#a53b35';return}msg.textContent='Unable to verify the admin session. Please try again.';msg.style.color='#a53b35'}catch(e){msg.textContent='Unable to verify the admin session. Please try again.';msg.style.color='#a53b35'}})();</script></body></htm
