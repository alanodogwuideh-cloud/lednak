<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Alan Odogwuideh</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css?v=729"></head><body class="login-only"><div id="loginLoading" class="login-loading" aria-live="polite"><div class="login-loading-card"><span class="login-spinner" aria-hidden="true"></span><span id="loginLoadingText">Preparing secure sign in…</span></div></div><main class="login-screen"><div class="login-card"><div class="admin-brand">Alan<span>.</span><small>Portfolio CMS</small></div><div class="eyebrow">PRIVATE ADMIN</div><h1>Sign in</h1><p>Sign in with your Supabase admin account to manage your portfolio.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" value="alanodogwuideh@gmail.com" autocomplete="username" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required autofocus></label><button id="signInBtn" class="primary full login-submit" type="submit" disabled><span class="login-btn-spinner login-spinner" aria-hidden="true" hidden></span><span id="signInText">Loading…</span></button></form><div style="margin-top:12px;text-align:center"><button id="forgotBtn" type="button" class="secondary">Forgot password?</button></div><div id="loginMsg" class="msg"></div></div></main><script>(async()=>{const msg=document.getElementById('loginMsg'),form=document.getElementById('loginForm'),forgot=document.getElementById('forgotBtn'),loading=document.getElementById('loginLoading'),loadingText=document.getElementById('loginLoadingText'),signInBtn=document.getElementById('signInBtn'),signInText=document.getElementById('signInText'),btnSpinner=document.querySelector('.login-btn-spinner');let client;let busy=false;const setMsg=(text,error=false)=>{msg.textContent=text;msg.style.color=error?'#a53b35':''};const setStartup=(text)=>{loadingText.textContent=text};const finishStartup=()=>{loading.hidden=true;signInBtn.disabled=false;signInText.textContent='Sign in'};const setBusy=(value,label='Signing in…')=>{busy=value;signInBtn.disabled=value;forgot.disabled=value;signInText.textContent=value?label:'Sign in';btnSpinner.hidden=!value;form.querySelectorAll('input').forEach(input=>input.disabled=value)};const withTimeout=async(promise,ms,label)=>{let timer;try{return await Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error(label)),ms)})])}finally{clearTimeout(timer)}};form.onsubmit=async e=>{e.preventDefault();if(busy||!client)return;const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password)return;setMsg('');setBusy(true);try{const result=await withTimeout(client.auth.signInWithPassword({email,password}),15000,'Sign in is taking too long. Please try again.');const {data,error}=result;if(error||!data?.session){setMsg(error?.message||'Invalid email or password.',true);return}setMsg('Signed in. Opening the CMS…');location.replace('/admin/app/')}catch(e){setMsg(e.message||'Unable to sign in. Please try again.',true)}finally{setBusy(false)}};forgot.onclick=async()=>{if(busy||!client)return;const email=document.getElementById('loginEmail').value.trim();if(!email){setMsg('Enter your admin email first.',true);return}setBusy(true,'Sending reset…');setMsg('');try{const result=await withTimeout(client.auth.resetPasswordForEmail(email,{redirectTo:`${location.origin}/admin/reset-password/`}),15000,'Password reset is taking too long. Please try again.');setMsg(result.error?result.error.message:'Password reset email sent. Check your inbox.')}catch(e){setMsg(e.message||'Unable to send the password reset email.',true)}finally{setBusy(false)}};try{setStartup('Connecting to the CMS…');const cfg=await withTimeout(fetch((location.hostname.endsWith('.hatchable.site')?'https://alanodogwuideh.com/api':'')+'/admin-config',{credentials:'include'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load authentication configuration.');return d}),10000,'The CMS connection is taking too long. Please refresh and try again.');setStartup('Loading secure sign in…');const s=document.createElement('script');const sdkReady=new Promise((resolve,reject)=>{s.onload=resolve;s.onerror=()=>reject(Error('Unable to load the sign-in service. Please refresh and try again.'))});s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';document.head.appendChild(s);await withTimeout(sdkReady,10000,'The sign-in service is taking too long to load. Please refresh and try again.');client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});setStartup('Checking your session…');const existing=await withTimeout(client.auth.getSession(),10000,'Session check is taking too long. Please refresh and try again.');if(existing.data?.session){location.replace('/admin/app/');return}setMsg('');finishStartup()}catch(e){loadingText.textContent='Sign in is ready to retry';setMsg(e.message||'Unable to load authentication.',true);signInText.textContent='Retry';btnSpinner.hidden=true;signInBtn.disabled=false;signInBtn.onclick=()=>location.reload()}})();</script></body></html>
