<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Alan Odogwuideh</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css"></head><body class="login-only"><main class="login-screen"><div class="login-card"><div class="admin-brand">Alan<span>.</span><small>Portfolio CMS</small></div><div class="eyebrow">PRIVATE ADMIN</div><h1>Sign in</h1><p>Sign in with your Supabase admin account to manage your portfolio.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" value="alanodogwuideh@gmail.com" autocomplete="username" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required autofocus></label><button class="primary full" type="submit">Sign in</button></form><div style="margin-top:12px;text-align:center"><button id="forgotBtn" type="button" class="secondary">Forgot password?</button></div><div id="loginMsg" class="msg"></div></div></main><script>(async()=>{const msg=document.getElementById('loginMsg'),form=document.getElementById('loginForm'),forgot=document.getElementById('forgotBtn');let client;const setMsg=(text,error=false)=>{msg.textContent=text;msg.style.color=error?'#a53b35':''};try{const cfg=await fetch('/api/admin-config').then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load authentication configuration.');return d});const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=async()=>{client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const existing=await client.auth.getSession();if(existing.data?.session){location.replace('/admin/app/');return}setMsg('');};s.onerror=()=>setMsg('Unable to load authentication.',true);document.head.appendChild(s);form.onsubmit=async e=>{e.preventDefault();if(!client){setMsg('Authentication is still loading…',true);return}setMsg('Signing in…');const email=document.getElementById('loginEmail').value.trim();const password=document.getElementById('loginPassword').value;const {data,error}=await client.auth.signInWithPassword({email,password});if(error||!data?.session){setMsg(error?.message||'Invalid email or password.',true);return}location.replace('/admin/app/');};forgot.onclick=async()=>{if(!client){setMsg('Authentication is still loading…',true);return}const email=document.getElementById('loginEmail').value.trim();if(!email){setMsg('Enter your admin email first.',true);return}setMsg('Sending password reset email…');const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:`${location.origin}/admin/reset-password/`});setMsg(error?error.message:'Password reset email sent. Check your inbox.');};}catch(e){setMsg(e.message||'Unable to load authentication.',true)}})();</script></body></html>
