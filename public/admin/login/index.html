<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Alan Odogwuideh</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css"></head><body class="login-only"><main class="login-screen"><div class="login-card"><div class="admin-brand">Alan<span>.</span><small>Portfolio CMS</small></div><div class="eyebrow">PRIVATE ADMIN</div><h1>Sign in</h1><p>Sign in to manage your portfolio content, case studies and media.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" value="alanodogwuideh@gmail.com" autocomplete="username" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required autofocus></label><button class="primary full" type="submit">Sign in</button></form><div id="loginMsg" class="msg"></div></div></main><script>const form=document.getElementById('loginForm'),msg=document.getElementById('loginMsg');form.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in…';const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:document.getElementById('loginEmail').value,password:document.getElementById('loginPassword').value})});let d={};try{d=await r.json()}catch{}if(!r.ok){msg.textContent=d.error||'Sign in failed.';msg.style.color='#a53b35';return}location.replace('/admin/app/')}</script></body></html>
