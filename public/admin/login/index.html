<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Alan Odogwuideh</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css"></head><body class="login-only"><main class="login-screen"><div class="login-card"><div class="admin-brand">Alan<span>.</span><small>Portfolio CMS</small></div><div class="eyebrow">PRIVATE ADMIN</div><h1>Sign in</h1><p>Sign in with your Supabase admin account to manage your portfolio.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" value="alanodogwuideh@gmail.com" autocomplete="username" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required autofocus></label><button class="primary full" type="submit">Sign in</button></form><div id="loginMsg" class="msg"></div></div></main><script>(async()=>{const msg=document.getElementById('loginMsg');const form=document.getElementById('loginForm');let client=null;try{const cfg=await fetch('/api/admin-config').then(r=>r.json());if(!window.supabase){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=()=>init(cfg);s.onerror=()=>msg.textContent='Unable to load authentication.';document.head.appendChild(s)}else init(cfg)}catch(e){msg.textContent='Unable to load authentication.'}function init(cfg){client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}form.onsubmit=async e=>{e.preventDefault();if(!client){msg.textContent='Authentication is still loading…';return}msg.textContent='Signing in…';msg.style.color='';const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value});if(error){msg.textContent=error.message||'Unable to sign in. Check your email and password.';msg.style.color='#a53b35';return}if(!data.session){msg.textContent='No active Supabase session was created.';msg.style.color='#a53b35';return}location.replace('/admin/app/')}})();</script></body></html>
