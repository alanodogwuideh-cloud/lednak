<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — Alan Odogwuideh</title><link rel="stylesheet" href="/admin/admin.css"></head><body class="login-only"><main class="login-screen"><div class="login-card"><div class="admin-brand">Alan<span>.</span><small>Portfolio CMS</small></div><div class="eyebrow">PRIVATE ADMIN</div><h1>Set a new password</h1><p id="resetIntro">Enter a new password for your Supabase admin account.</p><form id="resetForm"><label>New password<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="primary full" type="submit">Update password</button></form><div id="resetMsg" class="msg"></div><a href="/admin/login/" class="back-link">Back to sign in</a></div></main><script>(async()=>{const msg=document.getElementById('resetMsg'),form=document.getElementById('resetForm');let client;try{const cfg=await fetch('/api/admin-config').then(r=>r.json());const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=()=>{client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')document.getElementById('resetIntro').textContent='Choose a new password for your admin account.'});};s.onerror=()=>msg.textContent='Unable to load authentication.';document.head.appendChild(s)}catch(e){msg.textContent='Unable to load authentication.'}form.onsubmit=async e=>{e.preventDefault();if(!client){msg.textContent='Authentication is still loading…';return}const p=document.getElementById('newPassword').value;if(p!==document.getElementById('confirmPassword').value){msg.textContent='Passwords do not match.';return}msg.textContent='Updating password…';const {error}=await client.auth.updateUser({password:p});if(error){msg.textContent=error.message;return}msg.textContent='Password updated. Redirecting to sign in…';setTimeout(()=>location.replace('/admin/login/'),1200)}})();</script></body></html>
